<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Azure Glass">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff7ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="85%" cy="22%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="85%" r="44%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridPat" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0284c7" stroke-width="0.8" stroke-opacity="0.07"/>
    </pattern>
    <clipPath id="outerClip">
      <rect x="2" y="2" width="1196" height="276" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#outerClip)">
    <rect x="2" y="2" width="1196" height="276" rx="22" fill="url(#bgGrad)"/>
    <rect x="2" y="2" width="1196" height="276" fill="url(#gridPat)"/>
    <rect x="2" y="2" width="1196" height="276" fill="url(#glow1)"/>
    <rect x="2" y="2" width="1196" height="276" fill="url(#glow2)"/>
    <rect x="2" y="2" width="1196" height="4" fill="url(#accentGrad)"/>

    <!-- Decorative right crystal shards -->
    <g opacity="0.18" transform="translate(1048, 140)">
      <polygon points="0,-105 92,-48 76,68 0,108 -76,68 -92,-48" fill="none" stroke="url(#accentGrad)" stroke-width="1.3" stroke-dasharray="6 6"/>
      <polygon points="0,-68 58,-30 48,44 0,70 -48,44 -58,-30" fill="none" stroke="#38bdf8" stroke-width="1.1"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3 4"/>
      <circle cx="58" cy="-30" r="4" fill="#38bdf8"/>
      <circle cx="-48" cy="44" r="3.5" fill="#8b5cf6"/>
    </g>

    <!-- Left glass icon badge -->
    <g transform="translate(46, 84)">
      <rect width="104" height="104" rx="24" fill="rgba(255,255,255,0.88)" stroke="url(#accentGrad)" stroke-width="1.8"/>
      <g transform="translate(4, 4)">
        
    <!-- Outer faceted glass crystal -->
    <polygon points="48,14 78,34 72,72 48,84 24,72 18,34" fill="url(#accentGrad)" fill-opacity="0.16" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Inner facets -->
    <polyline points="18,34 48,46 78,34" fill="none" stroke="url(#accentGrad)" stroke-width="1.8" opacity="0.85"/>
    <line x1="48" y1="14" x2="48" y2="84" stroke="url(#accentGrad)" stroke-width="1.6" opacity="0.65"/>
    <polyline points="24,72 48,46 72,72" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
    <!-- Center sparkle -->
    <path d="M48 33 L51.5 42.5 L61 46 L51.5 49.5 L48 59 L44.5 49.5 L35 46 L44.5 42.5 Z" fill="url(#accentGrad)"/>
    <circle cx="67" cy="24" r="3" fill="#22d3ee"/>
  
      </g>
    </g>

    <!-- Eyebrow pill -->
    <g transform="translate(176, 48)">
      <rect width="396" height="26" rx="13" fill="rgba(241,245,249,0.92)" stroke="url(#accentGrad)" stroke-width="1" stroke-opacity="0.65"/>
      <text x="16" y="17.2" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">AZURE GLASS  ·  DEEPSEEK HARNESS (DSH) PLUGIN</text>
    </g>

    <text x="176" y="132" font-size="44" font-weight="800" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">Azure Glass</text>
    <text x="176" y="164" font-size="18" font-weight="600" fill="#64748b" letter-spacing="0.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">苍蓝琉璃工坊  ·  dsh-azure-glass</text>
    <text x="176" y="196" font-size="15.5" font-weight="500" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">All-in-one performance engine &amp; desktop-grade frosted glass customization for DeepSeek Harness (DSH)</text>
    
        <g transform="translate(176, 216)">
          <rect width="176" height="30" rx="15" fill="rgba(241,245,249,0.92)" stroke="rgba(148,163,184,0.38)" stroke-width="1"/>
          <circle cx="14" cy="15" r="3.5" fill="url(#accentGrad)"/>
          <text x="25" y="19.5" font-size="13" font-weight="600" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">DOM Virtualization</text>
        </g>
        <g transform="translate(364, 216)">
          <rect width="192" height="30" rx="15" fill="rgba(241,245,249,0.92)" stroke="rgba(148,163,184,0.38)" stroke-width="1"/>
          <circle cx="14" cy="15" r="3.5" fill="url(#accentGrad)"/>
          <text x="25" y="19.5" font-size="13" font-weight="600" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">9-Zone Frosted Glass</text>
        </g>
        <g transform="translate(568, 216)">
          <rect width="225" height="30" rx="15" fill="rgba(241,245,249,0.92)" stroke="rgba(148,163,184,0.38)" stroke-width="1"/>
          <circle cx="14" cy="15" r="3.5" fill="url(#accentGrad)"/>
          <text x="25" y="19.5" font-size="13" font-weight="600" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">Wallpaper Engine Coexist</text>
        </g>
  </g>

  <rect x="2" y="2" width="1196" height="276" rx="22" fill="none" stroke="rgba(56,189,248,0.30)" stroke-width="1.5"/>
</svg>
